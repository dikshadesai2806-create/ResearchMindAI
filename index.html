<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResearchMind AI - AI-Powered Research & Literature Assistant</title>
    <meta name="description" content="AI-Powered Research & Literature Assistant for exploring, analyzing, and understanding research papers." />
    <meta property="og:title" content="ResearchMind AI" />
    <meta property="og:description" content="AI-Powered Research & Literature Assistant for exploring, analyzing, and understanding research papers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // 1. Ensure trailing slash for GitHub Pages project subpaths (e.g. /my-repo -> /my-repo/)
      (function() {
        var p = window.location.pathname;
        if (p.length > 1 && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Static hosting auto-boot:
      // When served on GitHub Pages, /src/main.tsx is raw TypeScript and cannot run.
      // We immediately inject the pre-bundled production CSS and JS.
      (function() {
        var isStaticHosting = window.location.hostname.includes('github.io') || 
                              window.location.protocol === 'file:' || 
                              (window.location.port !== '3000' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1');

        if (isStaticHosting) {
          // Pre-load stylesheet
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/index.css';
          document.head.appendChild(link);

          // Pre-load javascript bundle
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/index.js';
          script.onload = function() {
            var loader = document.getElementById('app-boot-loader');
            if (loader) loader.remove();
          };
          document.head.appendChild(script);
        }
      })();
    </script>
  </head>
  <body class="bg-[#070e1b] text-slate-100 antialiased m-0 p-0">
    <div id="root">
      <!-- Fallback loader shown while React initializes -->
      <div id="app-boot-loader" style="min-height: 100vh; background-color: #070e1b; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(6,182,212,0.2); border-top-color: #06b6d4; border-radius: 50%; animation: rm-spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #ffffff;">Loading ResearchMind AI...</h2>
        <p style="font-size: 13px; color: #94a3b8; max-width: 420px; margin: 0 0 16px 0; line-height: 1.5;">Preparing your research workspace and paper analysis models.</p>
        
        <div id="deploy-troubleshoot-hint" style="display: none; max-width: 440px; background: #0c172e; border: 1px solid #1e345e; border-radius: 12px; padding: 16px; text-align: center; margin-top: 16px;">
          <p style="font-size: 13px; color: #cbd5e1; margin: 0 0 10px 0;">Initializing workspace...</p>
          <button onclick="window.location.reload()" style="background: #0284c7; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">Reload Application</button>
        </div>
      </div>
      <style>
        @keyframes rm-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        // Only show a reload button if loading exceeds 12 seconds and React hasn't mounted
        setTimeout(function() {
          if (!window.__RESEARCHMIND_MOUNTED__) {
            var el = document.getElementById('deploy-troubleshoot-hint');
            if (el) el.style.display = 'block';
          }
        }, 12000);
      </script>
    </div>

    <!-- Development entry point for Vite dev server (AI Studio port 3000) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
